[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
    "cp .env.example .env || true",
    "php artisan key:generate --force || true"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && php artisan storage:link || true && php artisan serve --host=0.0.0.0 --port=$PORT"